<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1c3f">
  <title>حسابي</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<main class="page"><div class="container">
  <div class="card profile-head" id="head"></div>
  <div style="height:22px"></div>
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="info" type="button" role="tab">بياناتي</button>
    <button class="tab" data-tab="security" type="button" role="tab">الأمان</button>
    <button class="tab" data-tab="favs" type="button" role="tab">المفضلة</button>
    <button class="tab" data-tab="history" type="button" role="tab">سجل القراءة</button>
    <button class="tab" data-tab="quiz" type="button" role="tab">مسابقاتي</button>
  </div>

  <section class="tab-panel active" id="tab-info"><div class="card" style="max-width:640px">
    <form class="form" id="infoForm" novalidate>
      <div class="form-msg" id="infoMsg" role="alert"></div>
      <div class="field"><label for="displayName">الاسم الظاهر</label><input class="input" id="displayName" maxlength="40" required></div>
      <div class="field"><label for="username">اسم المستخدم</label><input class="input" id="username" disabled dir="ltr"></div>
      <div class="field"><label for="grade">الصف الدراسي</label><select class="select" id="grade"><option value="">—</option></select></div>
      <button class="btn btn-gold" type="submit">حفظ التعديلات</button>
    </form></div></section>

  <section class="tab-panel" id="tab-security">
    <div class="form-grid" style="align-items:start">
      <div class="card"><h3>تغيير كلمة المرور</h3>
        <form class="form" id="pwForm" novalidate>
          <div class="form-msg" id="pwMsg" role="alert"></div>
          <div class="field"><label for="curPw">كلمة المرور الحالية</label><input class="input" id="curPw" type="password" autocomplete="current-password" maxlength="128"></div>
          <div class="field"><label for="newPw">كلمة المرور الجديدة</label><input class="input" id="newPw" type="password" autocomplete="new-password" maxlength="128"></div>
          <div class="field"><label for="newPw2">تأكيد كلمة المرور الجديدة</label><input class="input" id="newPw2" type="password" autocomplete="new-password" maxlength="128"></div>
          <button class="btn btn-navy" type="submit">تغيير كلمة المرور</button>
        </form></div>
      <div class="card"><h3>بريد الاسترداد (اختياري)</h3>
        <p class="muted">اربط بريدًا حقيقيًا لتتمكن من استعادة كلمة المرور. بعد تأكيد البريد من الرسالة التي سنرسلها، <strong>سجّل الدخول بهذا البريد</strong> بدل اسم المستخدم.</p>
        <form class="form" id="mailForm" novalidate>
          <div class="form-msg" id="mailMsg" role="alert"></div>
          <div class="field"><label for="recEmail">البريد الإلكتروني</label><input class="input" id="recEmail" type="email" dir="ltr" maxlength="120"></div>
          <div class="field"><label for="mailPw">كلمة المرور الحالية</label><input class="input" id="mailPw" type="password" autocomplete="current-password" maxlength="128"></div>
          <button class="btn btn-navy" type="submit">إرسال رابط التأكيد</button>
        </form></div>
    </div></section>

  <section class="tab-panel" id="tab-favs"><div class="books-grid" id="favGrid"></div></section>
  <section class="tab-panel" id="tab-history"><div class="table-wrap"><table class="tbl"><thead><tr><th>الكتاب</th><th>آخر صفحة</th><th>آخر قراءة</th><th></th></tr></thead><tbody id="histBody"></tbody></table></div></section>
  <section class="tab-panel" id="tab-quiz"><div class="table-wrap"><table class="tbl"><thead><tr><th>المسابقة</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody id="quizBody"></tbody></table></div></section>
</div></main>
<script type="module" src="assets/js/profile.js"></script>
</body>
</html>
