<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1c3f">
  <title>تواصل معنا</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="page-head"><div class="container"><h1>تواصل معنا</h1><p>اطلب كتابًا، أبلغ عن مشكلة، أو أرسل شكوى واقتراحًا.</p></div></div>
<main class="page"><div class="container" style="max-width:780px">
  <div class="tabs" id="types" role="tablist">
    <button class="tab" data-type="book_request" type="button">طلب إضافة كتاب</button>
    <button class="tab" data-type="broken_book" type="button">الإبلاغ عن كتاب لا يعمل</button>
    <button class="tab" data-type="complaint" type="button">شكوى</button>
    <button class="tab" data-type="suggestion" type="button">اقتراح</button>
    <button class="tab" data-type="contact" type="button">تواصل مع الإدارة</button>
  </div>
  <div class="card">
    <form class="form" id="form" novalidate>
      <div class="form-msg" id="msg" role="alert"></div>
      <div class="form-grid">
        <div class="field"><label for="name">الاسم</label><input class="input" id="name" maxlength="60" required></div>
        <div class="field"><label for="contactInfo">وسيلة تواصل (اختياري)</label><input class="input" id="contactInfo" maxlength="100" placeholder="بريد أو رقم هاتف"></div>
      </div>
      <div class="form-grid" id="bookFields" hidden>
        <div class="field"><label for="bookTitle">اسم الكتاب</label><input class="input" id="bookTitle" maxlength="150"></div>
        <div class="field"><label for="bookExtra">الصف / المادة / المؤلف</label><input class="input" id="bookExtra" maxlength="150"></div>
      </div>
      <div class="field" id="subjectField"><label for="subject">الموضوع</label><input class="input" id="subject" maxlength="120"></div>
      <div class="field"><label for="message" id="msgLabel">الرسالة</label><textarea class="textarea" id="message" maxlength="2000" required></textarea>
        <small class="muted"><span id="cnt">0</span> / 2000</small></div>
      <button class="btn btn-gold btn-lg" id="submit" type="submit">إرسال</button>
    </form>
  </div>
</div></main>
<script type="module" src="assets/js/contact.js"></script>
</body>
</html>
