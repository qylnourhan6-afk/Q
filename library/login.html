<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1c3f">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="login">
<main class="auth-wrap">
  <div class="auth-card">
    <h1>تسجيل الدخول</h1>
    <p class="sub">مرحبًا بعودتك! أدخل بياناتك للمتابعة.</p>
    <form class="form" id="form" novalidate>
      <div class="form-msg" id="msg" role="alert"></div>
      <div class="field"><label for="username">اسم المستخدم</label>
        <input class="input" id="username" autocomplete="username" autocapitalize="none" maxlength="60" required>
        <div class="field-err" data-for="username"></div></div>
      <div class="field"><label for="password">كلمة المرور</label>
        <div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="current-password" maxlength="128" required><button class="pw-toggle" type="button" data-toggle="password">إظهار</button></div>
        <div class="field-err" data-for="password"></div></div>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="remember" checked> تذكرني على هذا الجهاز</label>
      <button class="btn btn-gold btn-block btn-lg" id="submit" type="submit">دخول</button>
    </form>
    <div class="center-links">
      <a class="link" href="forgot.html">نسيت كلمة المرور؟</a>
      <span class="muted">ليس لديك حساب؟ <a class="link" href="register.html">أنشئ حسابًا</a></span>
      <a class="muted" href="index.html">العودة للرئيسية</a>
    </div>
  </div>
</main>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
