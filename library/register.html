<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1c3f">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="register">
<main class="auth-wrap">
  <div class="auth-card">
    <h1>إنشاء حساب جديد</h1>
    <p class="sub">سجّل بسهولة باسم مستخدم وكلمة مرور فقط.</p>
    <form class="form" id="form" novalidate>
      <div class="form-msg" id="msg" role="alert"></div>
      <div class="field"><label for="displayName">الاسم الظاهر</label>
        <input class="input" id="displayName" autocomplete="name" maxlength="40" required>
        <div class="field-err" data-for="displayName"></div></div>
      <div class="field"><label for="username">اسم المستخدم</label>
        <input class="input" id="username" autocomplete="username" autocapitalize="none" maxlength="20" dir="ltr" placeholder="student_01" required>
        <small class="muted">3–20 حرفًا: أحرف إنجليزية صغيرة وأرقام و ( _ . )</small>
        <div class="field-err" data-for="username"></div></div>
      <div class="field"><label for="grade">الصف الدراسي (اختياري)</label>
        <select class="select" id="grade"><option value="">—</option></select></div>
      <div class="field"><label for="password">كلمة المرور</label>
        <div class="pw-wrap"><input class="input" id="password" type="password" autocomplete="new-password" maxlength="128" required><button class="pw-toggle" type="button" data-toggle="password">إظهار</button></div>
        <div class="pw-meter"><i id="meter"></i></div>
        <div class="field-err" data-for="password"></div></div>
      <div class="field"><label for="confirm">تأكيد كلمة المرور</label>
        <input class="input" id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
        <div class="field-err" data-for="confirm"></div></div>
      <button class="btn btn-gold btn-block btn-lg" id="submit" type="submit">إنشاء الحساب</button>
    </form>
    <div class="center-links"><span class="muted">لديك حساب؟ <a class="link" href="login.html">سجّل الدخول</a></span></div>
  </div>
</main>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
